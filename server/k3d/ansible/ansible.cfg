[defaults]
fact_path = /etc/ansible/facts.d
inject_facts_as_vars = false
# Allow reconnect after host drops (e.g. reboot).
timeout = 300

[ssh_connection]
pipelining = True
# Override Ansible's default ControlMaster=auto/ControlPersist: mux sockets go stale
# ("Broken pipe" / "Failed to connect to new control master") when the host drops
# during apt/kernel/reboot. ServerAlive* detect dead peers; retries reconnect.
ssh_args = -o ControlMaster=no -o ServerAliveInterval=30 -o ServerAliveCountMax=10 -o StrictHostKeyChecking=accept-new
retries = 5
