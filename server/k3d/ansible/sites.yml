---
- name: Provision k3d hosts
  hosts: k3d
  gather_facts: false
  tasks:
    - name: Provision cluster tooling and single-node stack
      block:
        # Runs on every tagged invocation unless --skip-tags always.
        # Supplies ansible_facts / ansible_local before docker|cluster|argocd.
        - name: Ensure facts
          ansible.builtin.include_role:
            name: default
            tasks_from: ensure_facts.yml
            apply:
              tags: [always]
          tags: [always]

        - name: Prepare host
          ansible.builtin.include_role:
            name: default
            apply:
              tags: [bootstrap]
          tags: [bootstrap]

        - name: Install Docker
          ansible.builtin.include_role:
            name: docker
            apply:
              tags: [docker]
          tags: [docker]

        - name: Install k3d
          ansible.builtin.include_role:
            name: k3d
            apply:
              tags: [cluster]
          tags: [cluster]

        - name: Install kubectl
          ansible.builtin.include_role:
            name: kubectl
            apply:
              tags: [cluster]
          tags: [cluster]

        - name: Mount NAS
          ansible.builtin.include_role:
            name: nas
            apply:
              tags: [cluster]
          when: "'single_nodes' in group_names"
          tags: [cluster]

        - name: Create single-node cluster
          ansible.builtin.include_role:
            name: single_node
            apply:
              tags: [cluster]
          when: "'single_nodes' in group_names"
          tags: [cluster]

        - name: Install Argo CD
          ansible.builtin.include_role:
            name: argocd
            apply:
              tags: [argocd]
          when: "'single_nodes' in group_names"
          tags: [argocd]
      always:
        - name: Resume background package updates
          ansible.builtin.include_role:
            name: default
            tasks_from: resume_auto_updates.yml
            apply:
              tags: [always]
          tags: [always]
