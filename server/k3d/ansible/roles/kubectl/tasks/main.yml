---
- name: Install kubectl
  when: ansible_facts['ansible_local']['bin']['kubectl'] != kubectl_version
  block:
    - name: Download kubectl "{{ kubectl_version }}" for "{{ ansible_facts['ansible_local']['arch']['package'] }}"
      ansible.builtin.get_url:
        url: https://dl.k8s.io/release/v{{ kubectl_version }}/bin/linux/{{ ansible_facts['ansible_local']['arch']['package'] }}/kubectl
        dest: /var/ansible/tmp/kubectl
        mode: "0755"

    - name: Install kubectl
      become: true
      ansible.builtin.copy:
        src: /var/ansible/tmp/kubectl
        dest: /usr/local/bin/kubectl
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Remove kubectl download
      ansible.builtin.file:
        path: /var/ansible/tmp/kubectl
        state: absent

    - name: Bash completion for kubectl
      become: true
      ansible.builtin.shell: kubectl completion bash > /etc/bash_completion.d/kubectl
      changed_when: true
