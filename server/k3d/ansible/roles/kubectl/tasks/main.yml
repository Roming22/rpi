---
- name: Install kubectl
  when: ansible_facts['ansible_local']['bin']['kubectl'] != kubectl_version
  block:
    - name: Download kubectl "{{ kubectl_version }}" for "{{ ansible_facts['ansible_local']['arch']['package'] }}"
      ansible.builtin.get_url:
        url: https://dl.k8s.io/release/v{{ kubectl_version }}/bin/linux/{{ ansible_facts['ansible_local']['arch']['package'] }}/kubectl
        dest: /var/ansible/tmp/kubectl
        mode: "0755"
        checksum: "{{ kubectl_checksums[ansible_facts['ansible_local']['arch']['package']] }}"

    - name: Install kubectl
      become: true
      ansible.builtin.copy:
        src: /var/ansible/tmp/kubectl
        dest: /usr/local/bin/kubectl
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Remove kubectl download
      ansible.builtin.file:
        path: /var/ansible/tmp/kubectl
        state: absent

    - name: Generate kubectl bash completion
      ansible.builtin.command: kubectl completion bash
      register: kubectl_completion
      changed_when: false

    - name: Install kubectl bash completion
      become: true
      ansible.builtin.copy:
        content: "{{ kubectl_completion.stdout }}\n"
        dest: /etc/bash_completion.d/kubectl
        mode: "0644"
