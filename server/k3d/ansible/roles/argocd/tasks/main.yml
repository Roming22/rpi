---
- name: Deploy ArgoCD
  when: ansible_facts['ansible_local']['argocd']['installed'] != true
  block:
    - name: Create ArgoCD Namespace
      ansible.builtin.command: kubectl apply -f -
      args:
        stdin: "{{ lookup('file', role_path + '/files/argocd-namespace.yml') }}"
      changed_when: true

    - name: Apply ArgoCD manifests
      ansible.builtin.shell: kubectl apply -n argocd --server-side --force-conflicts -f https://raw.githubusercontent.com/argoproj/argo-cd/{{argocd_version}}/manifests/install.yaml
      changed_when: true

    - name: Wait for ArgoCD deployment
      ansible.builtin.command: >
        kubectl --namespace argocd rollout status deployment/argocd-server
        --timeout=300s

    - name: Wait for ArgoCD UI pods to appear
      ansible.builtin.command: >
        kubectl get pod -n argocd
        -l app.kubernetes.io/name=argocd-server -o name
      register: argocd_server_pods
      retries: 30
      delay: 2
      until: argocd_server_pods.stdout_lines | length > 0
      changed_when: false

    - name: Wait for ArgoCD UI pods to be ready
      ansible.builtin.command: >
        kubectl --namespace argocd wait --for=condition=Ready pod
        -l app.kubernetes.io/name=argocd-server --timeout=300s

    - name: Wait for Application CRD
      ansible.builtin.shell: |
        kubectl wait --for=condition=Established crd/applications.argoproj.io --timeout=120s

    - name: Refresh local facts after Argo CD install
      ansible.builtin.setup:
        fact_path: /etc/ansible/facts.d
        filter: ansible_local

- name: Deploy ArgoCD app-of-apps
  when: ansible_facts['ansible_local']['argocd']['app_of_apps'] != true
  block:
    - name: Apply ArgoCD app-of-apps
      ansible.builtin.shell: kubectl apply -n argocd -f {{ argocd_app_of_apps_url }}
      changed_when: true

    - name: Refresh local facts after app-of-apps
      ansible.builtin.setup:
        fact_path: /etc/ansible/facts.d
        filter: ansible_local

- name: Wait for all ArgoCD apps to be healthy
  when: ansible_facts['ansible_local']['argocd']['apps_healthy'] != true
  ansible.builtin.shell: |
    set -o pipefail
    output=$(kubectl get applications.argoproj.io -n argocd \
      -o jsonpath='{range .items[*]}{.metadata.name}={.status.health.status}{"\n"}{end}')
    echo "$output"
    [ -n "$output" ]
    ! echo "$output" | grep -Ev '=Healthy$'
  register: argocd_apps_healthy
  retries: 60
  delay: 10
  until: argocd_apps_healthy.rc == 0
  changed_when: false

- name: Check for ArgoCD initial admin secret
  ansible.builtin.command: kubectl -n argocd get secret argocd-initial-admin-secret
  register: argocd_admin_secret
  changed_when: false
  failed_when: false

- name: Check for Headlamp admin secret
  ansible.builtin.command: kubectl -n kube-system get secret headlamp-admin
  register: headlamp_secret
  changed_when: false
  failed_when: false

- name: Display information
  ansible.builtin.debug:
    msg:
      - "ArgoCD:"
      - "  URL: https://argocd.{{ inventory_hostname }}"
      - "  Username: admin"
      - >-
          Password: {{
            'kubectl -n argocd get secret argocd-initial-admin-secret -o jsonpath="{.data.password}" | base64 -d'
            if argocd_admin_secret.rc == 0 else 'unavailable'
          }}
      - "Headlamp:"
      - "  URL: https://{{ inventory_hostname }}"
      - >-
          Token: {{
            'kubectl -n kube-system get secret headlamp-admin -o jsonpath="{.data.token}" | base64 -d'
            if headlamp_secret.rc == 0 else 'unavailable'
          }}
