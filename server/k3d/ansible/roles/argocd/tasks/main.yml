---
- name: Deploy ArgoCD
  when: ansible_facts['ansible_local']['argocd']['version'] != argocd_version
  block:
    - name: Create ArgoCD Namespace
      ansible.builtin.command: kubectl apply -f -
      args:
        stdin: "{{ lookup('file', role_path + '/files/argocd-namespace.yml') }}"
      register: argocd_ns_apply
      changed_when: "'configured' in argocd_ns_apply.stdout or 'created' in argocd_ns_apply.stdout"

    - name: Download ArgoCD install manifests
      ansible.builtin.get_url:
        url: https://raw.githubusercontent.com/argoproj/argo-cd/{{ argocd_version }}/manifests/install.yaml
        dest: /var/ansible/tmp/argocd-install.yaml
        mode: "0644"
        checksum: "{{ argocd_install_checksum }}"

    - name: Apply ArgoCD manifests
      ansible.builtin.command: >
        kubectl apply -n argocd --server-side --force-conflicts
        -f /var/ansible/tmp/argocd-install.yaml
      register: argocd_install_apply
      changed_when: >
        'created' in argocd_install_apply.stdout
        or 'configured' in argocd_install_apply.stdout

    - name: Wait for ArgoCD deployment
      ansible.builtin.command: >
        kubectl --namespace argocd rollout status deployment/argocd-server
        --timeout=300s

    - name: Wait for ArgoCD UI pods to appear
      ansible.builtin.command: >
        kubectl get pod -n argocd
        -l app.kubernetes.io/name=argocd-server -o name
      register: argocd_server_pods
      retries: 30
      delay: 2
      until: argocd_server_pods.stdout_lines | length > 0
      changed_when: false

    - name: Wait for ArgoCD UI pods to be ready
      ansible.builtin.command: >
        kubectl --namespace argocd wait --for=condition=Ready pod
        -l app.kubernetes.io/name=argocd-server --timeout=300s

    - name: Wait for Application CRD
      ansible.builtin.command: >
        kubectl wait --for=condition=Established
        crd/applications.argoproj.io --timeout=120s
      changed_when: false

    - name: Record installed Argo CD version
      ansible.builtin.copy:
        dest: /var/ansible/argocd_version
        content: "{{ argocd_version }}\n"
        mode: "0644"

    - name: Refresh local facts after Argo CD install
      ansible.builtin.setup:
        fact_path: /etc/ansible/facts.d
        filter: ansible_local

- name: Deploy ArgoCD app-of-apps
  when: ansible_facts['ansible_local']['argocd']['app_of_apps'] != true
  block:
    - name: Check app-of-apps URL is reachable
      ansible.builtin.uri:
        url: "{{ argocd_app_of_apps_url }}"
        method: GET
        status_code: 200

    - name: Apply ArgoCD app-of-apps
      ansible.builtin.command: >
        kubectl apply -n argocd -f {{ argocd_app_of_apps_url }}
      register: argocd_app_of_apps_apply
      changed_when: >
        'created' in argocd_app_of_apps_apply.stdout
        or 'configured' in argocd_app_of_apps_apply.stdout

    - name: Refresh local facts after app-of-apps
      ansible.builtin.setup:
        fact_path: /etc/ansible/facts.d
        filter: ansible_local

- name: Wait for all ArgoCD apps to be healthy
  when: ansible_facts['ansible_local']['argocd']['apps_healthy'] != true
  ansible.builtin.shell: |
    set -o pipefail
    output=$(kubectl get applications.argoproj.io -n argocd \
      -o jsonpath='{range .items[*]}{.metadata.name}={.status.health.status}{"\n"}{end}')
    echo "$output"
    [ -n "$output" ]
    ! echo "$output" | grep -Ev '=Healthy$'
  register: argocd_apps_healthy
  retries: 60
  delay: 10
  until: argocd_apps_healthy.rc == 0
  changed_when: false
