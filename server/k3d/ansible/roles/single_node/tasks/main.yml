---
- name: Ensure local registry is ready
  block:
    - name: Create local registry
      when: ansible_facts['ansible_local']['cluster']['registry'] == ""
      ansible.builtin.command: k3d registry create registry.localhost -p 5000

    - name: Wait for local registry to be ready
      ansible.builtin.uri:
        url: http://k3d-registry.localhost:5000/v2/_catalog
        method: GET
        status_code: 200
      register: registry_ready
      retries: 30
      delay: 2
      until: registry_ready.status | default(0) == 200

    - name: Refresh local facts after registry ensure
      ansible.builtin.setup:
        fact_path: /etc/ansible/facts.d
        filter: ansible_local
  rescue:
    - name: Delete partial k3d registry after failure
      ansible.builtin.command: k3d registry delete registry.localhost
      register: k3d_registry_delete
      failed_when: false
      changed_when: k3d_registry_delete.rc == 0

    - name: Fail after cleaning up partial k3d registry
      ansible.builtin.fail:
        msg: >-
          k3d registry create/ready check failed for registry.localhost;
          partial registry was deleted so the next run can retry.

- name: Ensure NAS storage directories exist
  become: true
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
  loop:
    - /mnt/nas/storage/persistentvolumes
    - /mnt/nas/storage/storageclasses/local-path

# Mount is already per-host (.../homelab/{{ inventory_hostname }}); no extra hostname under /mnt/nas.
- name: Remove listed-but-unusable k3d cluster
  when: ansible_facts['ansible_local']['cluster']['exists'] != true
  ansible.builtin.command: >
    k3d cluster delete {{ inventory_hostname }} --yes
  register: k3d_stale_delete
  failed_when: false
  changed_when: k3d_stale_delete.rc == 0

- name: Deploy k3d cluster
  when: ansible_facts['ansible_local']['cluster']['exists'] != true
  block:
    - name: Deploy k3d cluster
      ansible.builtin.shell: |
        CLUSTER_NAME="{{ inventory_hostname }}"
        k3d cluster create "${CLUSTER_NAME}" \
          --agents 1 \
          --api-port "0.0.0.0:6443" \
          --k3s-arg "--cluster-domain=${CLUSTER_NAME}.local@server:0" \
          --k3s-arg "--tls-san={{ ansible_facts['default_ipv4']['address'] }}@server:0" \
          --k3s-arg "--tls-san={{ inventory_hostname }}@server:0" \
          --kubeconfig-switch-context \
          --kubeconfig-update-default \
          --port "443:443@loadbalancer" \
          --registry-use "k3d-registry.localhost:5000" \
          --servers 1 \
          --timeout 300s \
          --volume "/mnt/nas/storage/persistentvolumes:/mnt/nas@server:0" \
          --volume "/mnt/nas/storage/storageclasses/local-path:/var/lib/rancher/k3s/storage@server:0" \
          --wait
      args:
        executable: /bin/bash

    - name: Edit kubeconfig to reference the node hostname
      ansible.builtin.replace:
        path: "{{ ansible_facts['env']['HOME'] }}/.kube/config"
        regexp: https://0\.0\.0\.0(:\d+)?
        replace: "https://{{ inventory_hostname }}\\1"

    - name: Wait for cluster nodes to be ready
      ansible.builtin.command: >
        kubectl wait --for=condition=Ready nodes --all --timeout=300s

    - name: Wait for core DNS pods to appear
      ansible.builtin.command: >
        kubectl get pod -n kube-system -l k8s-app=kube-dns -o name
      register: coredns_pods
      retries: 30
      delay: 2
      until: coredns_pods.stdout_lines | length > 0
      changed_when: false

    - name: Wait for core DNS pods to be ready
      ansible.builtin.command: >
        kubectl wait --for=condition=Ready pod -l k8s-app=kube-dns
        -n kube-system --timeout=120s

    - name: Wait for local-path-provisioner pods to appear
      ansible.builtin.command: >
        kubectl get pod -n kube-system
        -l app.kubernetes.io/name=local-path-provisioner -o name
      register: local_path_pods
      retries: 30
      delay: 2
      until: local_path_pods.stdout_lines | length > 0
      changed_when: false

    - name: Wait for local-path-provisioner pods to be ready
      ansible.builtin.command: >
        kubectl wait --for=condition=Ready pod
        -l app.kubernetes.io/name=local-path-provisioner
        -n kube-system --timeout=120s

    - name: Refresh local facts after cluster create
      ansible.builtin.setup:
        fact_path: /etc/ansible/facts.d
        filter: ansible_local
  rescue:
    - name: Delete partial k3d cluster after create failure
      ansible.builtin.command: >
        k3d cluster delete {{ inventory_hostname }} --yes
      register: k3d_delete
      failed_when: false
      changed_when: k3d_delete.rc == 0

    - name: Fail after cleaning up partial k3d cluster
      ansible.builtin.fail:
        msg: >-
          k3d cluster create failed for {{ inventory_hostname }};
          partial cluster was deleted so the next run can retry.
