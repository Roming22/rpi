---
- name: Mount the NAS
  when: ansible_facts['ansible_local']['nas']['source'] != nas_expected_source
  vars:
    nas_expected_source: "truenas.local:/mnt/pool-0/homelab/{{ inventory_hostname }}"
  block:
    - name: Create a directory if it does not exist
      become: true
      ansible.builtin.file:
        path: /mnt/nas
        state: directory
        mode: "0755"

    - name: Install dependencies
      become: true
      ansible.builtin.apt:
        name:
          - nfs-common
        state: present
        lock_timeout: 300

    - name: Wait for truenas.local to resolve
      ansible.builtin.command: getent hosts truenas.local
      register: truenas_dns
      retries: 30
      delay: 2
      until: truenas_dns.rc == 0
      changed_when: false

    # Idempotent: corrects a wrong/stale mount as well as creating a missing one.
    - name: Mount NAS
      become: true
      ansible.posix.mount:
        src: "{{ nas_expected_source }}"
        path: /mnt/nas
        opts: _netdev,x-systemd.automount
        state: mounted
        fstype: nfs
