---
- name: Install k3d
  when: ansible_facts['ansible_local']['bin']['k3d'] != k3d_version
  block:
    - name: Download k3d "{{ k3d_version }}" for "{{ ansible_facts['ansible_local']['arch']['package'] }}"
      ansible.builtin.get_url:
        url: https://github.com/k3d-io/k3d/releases/download/v{{ k3d_version }}/k3d-linux-{{ ansible_facts['ansible_local']['arch']['package'] }}
        dest: /var/ansible/tmp/k3d
        mode: "0755"
        checksum: "{{ k3d_checksums[ansible_facts['ansible_local']['arch']['package']] }}"

    - name: Install k3d
      become: true
      ansible.builtin.copy:
        src: /var/ansible/tmp/k3d
        dest: /usr/local/bin/k3d
        remote_src: true
        owner: root
        group: root
        mode: "0755"

    - name: Remove k3d download
      ansible.builtin.file:
        path: /var/ansible/tmp/k3d
        state: absent

    - name: Generate k3d bash completion
      ansible.builtin.command: k3d completion bash
      register: k3d_completion
      changed_when: false

    - name: Install k3d bash completion
      become: true
      ansible.builtin.copy:
        content: "{{ k3d_completion.stdout }}\n"
        dest: /etc/bash_completion.d/k3d
        mode: "0644"
