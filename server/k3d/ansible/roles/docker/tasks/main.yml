---
- name: Install docker
  when: ansible_facts['ansible_local']['bin']['docker'] == ""
  block:
    - name: Install dependencies
      become: true
      ansible.builtin.apt:
        name:
          - apt-transport-https
          - ca-certificates
          - gnupg
        state: present
        lock_timeout: 300

    - name: Ensure APT keyrings directory exists
      become: true
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      become: true
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker repository
      become: true
      ansible.builtin.apt_repository:
        repo: deb [arch={{ ansible_facts['ansible_local']['arch']['package'] }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable
        state: present
        filename: docker

    - name: Install Docker
      become: true
      ansible.builtin.apt:
        name:
          - docker-ce
        state: present
        update_cache: true
        lock_timeout: 300

- name: Ensure the docker service is started and enabled
  become: true
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true

- name: Add user to the docker group
  when: ansible_facts['ansible_local']['docker']['group_set'] == false
  block:
    - name: Ensure ansible user is added to the docker group
      become: true
      ansible.builtin.user:
        name: "{{ ansible_user }}"
        groups: ["docker"]
        append: true

    - name: Reset SSH connection to pick up docker group membership
      ansible.builtin.meta: reset_connection
