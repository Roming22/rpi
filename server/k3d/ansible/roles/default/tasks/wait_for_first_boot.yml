---
# Wait until first-boot cloud-init and pending upgrades finish (including reboot if required).
- name: Wait for system package readiness
  block:
    - name: Check if system uses cloud-init
      ansible.builtin.stat:
        path: /var/lib/cloud-init
      register: cloud_init_dir

    - name: Wait for cloud-init to finish
      ansible.builtin.command: cloud-init status --wait
      when: cloud_init_dir.stat is defined and cloud_init_dir.stat.isdir is defined and cloud_init_dir.stat.isdir
      register: cloud_init_status
      changed_when: false

    - name: Wait for APT locks to be released
      ansible.builtin.include_tasks: wait_for_apt.yml

    - name: Stop unattended-upgrades after active apt work finishes
      become: yes
      become_user: root
      ansible.builtin.systemd:
        name: unattended-upgrades
        state: stopped
      failed_when: false

    - name: Check whether a reboot is required after upgrades
      ansible.builtin.stat:
        path: /var/run/reboot-required
      register: reboot_required

    - name: Reboot to finish pending upgrades
      when: reboot_required.stat.exists
      block:
        - name: Reboot host
          become: yes
          become_user: root
          ansible.builtin.reboot:
            reboot_timeout: 900

        - name: Wait for SSH after reboot
          ansible.builtin.wait_for_connection:
            timeout: 300
            delay: 5

        - name: Wait for APT locks after reboot
          ansible.builtin.include_tasks: wait_for_apt.yml
