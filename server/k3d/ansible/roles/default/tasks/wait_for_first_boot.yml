---
# Wait until first-boot cloud-init and pending upgrades finish (including reboot if required).
# Prefer calling pause_auto_updates.yml before this so hourly upgrade/reboot cannot race.
- name: Wait for system package readiness
  block:
    - name: Check whether cloud-init is available
      ansible.builtin.command: which cloud-init
      register: cloud_init_bin
      changed_when: false
      failed_when: false

    - name: Wait for cloud-init to finish
      ansible.builtin.command:
        argv:
          - timeout
          - "1800"
          - cloud-init
          - status
          - --wait
      when: cloud_init_bin.rc == 0
      register: cloud_init_status
      changed_when: false

    - name: Wait for APT locks to be released
      ansible.builtin.include_tasks: wait_for_apt.yml

    - name: Stop unattended-upgrades after active apt work finishes
      become: true
      ansible.builtin.systemd:
        name: unattended-upgrades
        state: stopped
      failed_when: false

    - name: Drain reboot-required up to 3 times
      ansible.builtin.include_tasks: drain_reboot_required.yml
      loop: "{{ range(1, 4) | list }}"
      loop_control:
        label: "pass {{ item }}"
