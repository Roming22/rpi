---
# Bootstrap local SSH config, Ansible dirs/facts, and base host services.
- name: Add or update user in local SSH config for each host
  ansible.builtin.shell: |
    set -e
    ssh_config="{{ lookup('env', 'HOME') | trim }}/.ssh/config"
    mkdir -p "$(dirname "$ssh_config")"
    host="{{ item }}"
    user="{{ hostvars[item].ansible_user | default(remote_user) }}"
    status="unchanged"
    if [ ! -f "$ssh_config" ] || ! grep -qE "^Host[[:space:]]${host}([[:space:]]|\$)" "$ssh_config" 2>/dev/null; then
      printf '\nHost %s\n    User %s\n' "$host" "$user" >> "$ssh_config"
      status="changed"
    else
      current_user=$(awk -v hostname="$host" '
        /^Host[[:space:]]/ { in_block = ($1 == "Host" && $2 == hostname); next }
        in_block && /^[[:space:]]*User[[:space:]]/ { print $2; exit }
      ' "$ssh_config")
      if [ "${current_user:-}" != "$user" ]; then
        awk -v hostname="$host" -v username="$user" '
          /^Host[[:space:]]/ {
            if (in_block && !user_done) print "    User " username
            in_block = ($1 == "Host" && $2 == hostname)
            user_done = 0
          }
          in_block && /^[[:space:]]*User[[:space:]]/ {
            print "    User " username
            user_done = 1
            next
          }
          END { if (in_block && !user_done) print "    User " username }
          { print }
        ' "$ssh_config" > "$ssh_config.tmp" && mv "$ssh_config.tmp" "$ssh_config"
        status="changed"
      fi
    fi
    echo "SSH_CONFIG_STATUS=$status"
  delegate_to: localhost
  run_once: true
  register: ssh_config_result
  changed_when: "'SSH_CONFIG_STATUS=changed' in (ssh_config_result.stdout | default(''))"
  loop: "{{ ansible_play_hosts }}"
  loop_control:
    label: "{{ item }}"

- name: Setup Ansible facts
  block:
    - name: Ansible var dir
      become: true
      ansible.builtin.file:
        path: /var/ansible
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0775"

    - name: Ansible var/tmp dir
      ansible.builtin.file:
        path: /var/ansible/tmp
        state: directory
        mode: "0775"

    - name: Ensure custom facts directory exists on target
      become: true
      ansible.builtin.file:
        path: /etc/ansible/facts.d
        state: directory
        mode: "0755"

    - name: Copy fact scripts into /etc/ansible/facts.d
      become: true
      ansible.builtin.copy:
        src: "{{ item }}"
        dest: "/etc/ansible/facts.d/{{ item | basename }}"
        mode: "0755"
      with_fileglob:
        - "{{ role_path }}/resources/facts.d/*.fact"

- name: Get Facts
  block:
    - name: Get Facts
      ansible.builtin.setup:
        fact_path: /etc/ansible/facts.d

    - name: Print facts
      ansible.builtin.debug:
        var: ansible_facts
        verbosity: 1

- name: Install and enable avahi-daemon
  when: ansible_facts['ansible_local']['avahi']['installed'] != true or ansible_facts['ansible_local']['avahi']['service_enabled'] != true
  block:
    - name: Install avahi-daemon
      become: true
      ansible.builtin.apt:
        name: avahi-daemon
        state: present
        lock_timeout: 300

    - name: Enable and start avahi-daemon
      become: true
      ansible.builtin.service:
        name: avahi-daemon
        state: started
        enabled: true
