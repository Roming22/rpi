---
# Keep background apt (and the hourly reboot cron) from racing Ansible, then
# drain any in-flight dpkg work before continuing.
- name: Disable apt timers/services during provisioning
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: stopped
    enabled: false
  loop:
    # Timers alone leave an in-flight apt-daily-upgrade.service / unattended-upgr running.
    - apt-daily.timer
    - apt-daily-upgrade.timer
    - apt-daily.service
    - apt-daily-upgrade.service
  failed_when: false

- name: Disable hourly system-upgrade cron during provisioning
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    if [ -e /etc/cron.hourly/system-upgrade ]; then
      mv /etc/cron.hourly/system-upgrade /etc/cron.hourly/system-upgrade.disabled-for-provisioning
      echo moved
    elif [ -e /etc/cron.hourly/system-upgrade.disabled-for-provisioning ]; then
      echo already_disabled
    else
      echo absent
    fi
  args:
    executable: /bin/bash
  register: hourly_upgrade_disable
  changed_when: (hourly_upgrade_disable.stdout | default('') | trim) == "moved"

- name: Prevent unattended-upgrades from rebooting mid-play
  become: true
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/99-provisioning-no-reboot
    mode: "0644"
    content: |
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Disable unattended-upgrades during provisioning
  become: true
  ansible.builtin.systemd:
    name: unattended-upgrades
    state: stopped
    enabled: false
  register: unattended_upgrades_pause
  failed_when:
    - unattended_upgrades_pause is failed
    - "'Could not find the requested service' not in (unattended_upgrades_pause.msg | default(''))"

- name: Check for needrestart conf.d
  ansible.builtin.stat:
    path: /etc/needrestart/conf.d
  register: needrestart_conf_d

- name: Make needrestart noninteractive during provisioning
  when: needrestart_conf_d.stat.exists
  become: true
  ansible.builtin.copy:
    dest: /etc/needrestart/conf.d/99-provisioning-auto.conf
    mode: "0644"
    content: |
      # Avoid interactive prompts that can stall apt-daily-upgrade mid-play.
      $nrconf{restart} = 'a';

- name: Wait for APT locks after pausing auto-updates
  ansible.builtin.include_tasks: wait_for_apt.yml
