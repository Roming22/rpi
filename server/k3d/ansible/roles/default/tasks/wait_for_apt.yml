---
# Wait until no process holds the dpkg/apt locks (e.g. unattended-upgrades, apt-daily).
# apt/dpkg use POSIX lockf (F_SETLK); flock(2) does not conflict with those on Linux.
- name: Wait for APT locks to be released
  become: true
  ansible.builtin.shell: |
    python3 - <<'PY'
    import fcntl
    import os
    import sys

    locks = (
        "/var/lib/dpkg/lock",
        "/var/lib/dpkg/lock-frontend",
        "/var/lib/apt/lists/lock",
        "/var/cache/apt/archives/lock",
    )
    for path in locks:
        if not os.path.exists(path):
            continue
        fd = os.open(path, os.O_RDWR)
        try:
            fcntl.lockf(fd, fcntl.LOCK_EX | fcntl.LOCK_NB)
            fcntl.lockf(fd, fcntl.LOCK_UN)
        except OSError:
            sys.exit(1)
        finally:
            os.close(fd)
    sys.exit(0)
    PY
  args:
    executable: /bin/bash
  register: apt_lock_free
  retries: 60
  delay: 10
  until: apt_lock_free.rc == 0
  changed_when: false
