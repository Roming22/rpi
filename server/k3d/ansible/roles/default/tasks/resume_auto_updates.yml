---
# Undo pause_auto_updates.yml after provisioning finishes.
- name: Re-enable apt timers after provisioning
  become: true
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: started
    enabled: true
  loop:
    - apt-daily.timer
    - apt-daily-upgrade.timer
  register: apt_timer_resume
  failed_when:
    - apt_timer_resume is failed
    - "'Could not find the requested service' not in (apt_timer_resume.msg | default(''))"

- name: Check for disabled hourly system-upgrade cron
  ansible.builtin.stat:
    path: /etc/cron.hourly/system-upgrade.disabled-for-provisioning
  register: hourly_upgrade_disabled

- name: Re-enable hourly system-upgrade cron after provisioning
  become: true
  ansible.builtin.shell: |
    set -euo pipefail
    if [ -e /etc/cron.hourly/system-upgrade.disabled-for-provisioning ]; then
      mv /etc/cron.hourly/system-upgrade.disabled-for-provisioning /etc/cron.hourly/system-upgrade
      echo moved
    elif [ -e /etc/cron.hourly/system-upgrade ]; then
      echo already_enabled
    else
      echo absent
    fi
  args:
    executable: /bin/bash
  register: hourly_upgrade_enable
  changed_when: (hourly_upgrade_enable.stdout | default('') | trim) == "moved"

- name: Assert hourly system-upgrade cron was restored
  when: hourly_upgrade_disabled.stat.exists
  ansible.builtin.stat:
    path: /etc/cron.hourly/system-upgrade
  register: hourly_upgrade_restored
  failed_when: not hourly_upgrade_restored.stat.exists

- name: Remove provisioning unattended-upgrades reboot override
  become: true
  ansible.builtin.file:
    path: /etc/apt/apt.conf.d/99-provisioning-no-reboot
    state: absent

- name: Remove provisioning needrestart override
  become: true
  ansible.builtin.file:
    path: /etc/needrestart/conf.d/99-provisioning-auto.conf
    state: absent


- name: Re-enable unattended-upgrades after provisioning
  become: true
  ansible.builtin.systemd:
    name: unattended-upgrades
    state: started
    enabled: true
  register: unattended_upgrades_resume
  failed_when:
    - unattended_upgrades_resume is failed
    - "'Could not find the requested service' not in (unattended_upgrades_resume.msg | default(''))"
